# 复制到 .local/dev-setup.conf 后修改；该文件是 Bash 配置，只加载你信任的内容。
# 不保存密码、GitHub token 或 OpenAI API key。
TUNNEL_MODE=existing
PROXY_URL=http://127.0.0.1:17890

# ssh 模式：运行脚本的机器主动连接 SSH_TARGET，将对端代理转发到本机。
# PROXY_URL 必须为 http://127.0.0.1:$LOCAL_PORT。
SSH_TARGET='user@proxy-host'
SSH_PORT=22
LOCAL_PORT=17890
REMOTE_PROXY_PORT=7890

GIT_NAME='你的 Git 用户名'
GIT_EMAIL='你的 Git 提交邮箱'
